# Builds Remotely from THIS repository (Serity fork):
#   1. Windows job: runs tests, then Utilities/Publish.ps1, which builds and zips
#      the agents (Windows/Linux/macOS), the desktop/instant-support apps, and
#      publishes the server (self-contained, linux-x64) with those packages in
#      wwwroot/Content.
#   2. Docker job: wraps the published server in Server/Dockerfile and pushes it
#      to GitHub Container Registry (ghcr.io/<owner>/remotely).
#
# Run it from the Actions tab: Build -> Run workflow -> pick the branch.
#
# Code signing is optional. If the BASE64_ENCODED_PFX and PFX_KEY repository
# secrets are not set, signing is skipped and binaries are unsigned.
#
# IMPORTANT: agents self-update whenever the packages served by the server
# change. Deploying an image from this workflow will update every connected
# agent within hours. Validate on a staging server first.

name: Build

on:
  workflow_dispatch:
    inputs:
      rid:
        description: 'Server Runtime Identifier'
        required: false
        default: "linux-x64"
      push_image:
        description: 'Build and push the Docker image to GHCR'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:

  build-windows:

    runs-on: windows-latest

    env:
      Solution_Name: Remotely.sln
      Configuration: Release
      PfxBase64: ${{ secrets.BASE64_ENCODED_PFX }}
      PfxKey: ${{ secrets.PFX_KEY }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Execute unit tests
      run: |
        dotnet test Tests/Server.Tests/Server.Tests.csproj -c Release
        dotnet test Tests/Shared.Tests/Shared.Tests.csproj -c Release

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

    - name: Decode the pfx
      run: |
        if (!($env:PfxBase64)) {
          echo "Skipping cert signing because BASE64_ENCODED_PFX secret is missing."
          return
        }
        echo "Creating Pfx for signing assemblies."
        $pfx_cert_byte = [System.Convert]::FromBase64String($env:PfxBase64)
        $certificatePath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes($certificatePath, $pfx_cert_byte)

    - name: Set current version
      id: version
      shell: powershell
      run: |
        $VersionString = git show -s --format=%ci
        $VersionDate = [DateTimeOffset]::Parse($VersionString)
        $CurrentVersion = $VersionDate.ToString("yyyy.MM.dd.HHmm")
        echo "CurrentVersion=$CurrentVersion" >> $env:GITHUB_ENV
        echo "version=$CurrentVersion" >> $env:GITHUB_OUTPUT
        Write-Host "Setting current version to $CurrentVersion."

    # Builds agents (incl. macOS x64/arm64), desktop apps and the server.
    - name: Run Publish script
      shell: powershell
      run: |
        .\Utilities\Publish.ps1 -CertificatePath "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx" -CertificatePassword $env:PfxKey -CurrentVersion $env:CurrentVersion -RID ${{ github.event.inputs.rid }} -OutDir "$env:GITHUB_WORKSPACE\publish"
        Set-Content -Path "$env:GITHUB_WORKSPACE\publish\Version.txt" -Value $env:CurrentVersion -NoNewline

    - name: Remove the pfx
      if: always()
      run: |
        if (Test-Path "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx") {
          Remove-Item -path "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx"
        }

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Server
        path: ./publish/
        if-no-files-found: error

  docker:

    needs: build-windows
    if: ${{ github.event.inputs.push_image == 'true' && github.event.inputs.rid == 'linux-x64' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Download server build
      uses: actions/download-artifact@v4
      with:
        name: Server
        path: ./Server/bin/publish

    - name: Image name
      id: image
      run: |
        echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remotely" >> "$GITHUB_OUTPUT"
        echo "branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Tags: exact version (pin this in production), branch name, and 'latest'
    # only when built from master.
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Server/Dockerfile
        push: true
        tags: |
          ${{ steps.image.outputs.name }}:${{ needs.build-windows.outputs.version }}
          ${{ steps.image.outputs.name }}:${{ steps.image.outputs.branch }}
          ${{ github.ref_name == 'master' && format('{0}:latest', steps.image.outputs.name) || '' }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ needs.build-windows.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
